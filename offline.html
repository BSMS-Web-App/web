<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#BB001E">
<title>You're Offline | BSMS Web</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101014;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.card{width:min(460px,100%);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.045);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.3)}.mark{width:58px;height:58px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;background:rgba(187,0,30,.18);color:#ff6579;font-size:25px}h1{margin:0 0 10px;font-size:25px}p{margin:0;color:rgba(255,255,255,.68);font-size:15px;line-height:1.55}button{margin-top:24px;padding:11px 18px;border:0;border-radius:12px;background:#BB001E;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<div class="mark" aria-hidden="true">!</div>
<h1>You're offline</h1>
<p>BSMS Web couldn't load this page because your device isn't connected. Check your internet connection, then try again.</p>
<button type="button" onclick="window.location.reload()">Try Again</button>
</main>
</body>
</html>
