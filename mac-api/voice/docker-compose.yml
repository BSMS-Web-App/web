services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: bsms-web-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          udp_port: 3478
          tls_port: 5349
          domain: ${LIVEKIT_TURN_DOMAIN:-turn.bsms-web.com}
          cert_file: /etc/livekit/certs/fullchain.pem
          key_file: /etc/livekit/certs/privkey.pem
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./certs:/etc/livekit/certs:ro
