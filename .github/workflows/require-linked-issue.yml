name: Require Linked Issue

on:
  pull_request:
    branches:
      - main
      - dev1
      - dev2
      - dev3
      - dev4
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  issues: read
  pull-requests: read

jobs:
  require-linked-issue:
    name: Linked Issue Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for a linked closing issue
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequestNumber = context.payload.pull_request.number;

            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        title
                        url
                      }
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pullRequestNumber,
              }
            );

            const issues =
              result.repository.pullRequest.closingIssuesReferences.nodes;

            if (issues.length === 0) {
              core.setFailed(
                'This pull request must reference at least one issue that it closes. Add a line such as "Closes #123" to the pull request description.'
              );
              return;
            }

            core.info(
              `Found ${issues.length} linked closing issue(s): ${issues
                .map((issue) => `#${issue.number}`)
                .join(', ')}`
            );
