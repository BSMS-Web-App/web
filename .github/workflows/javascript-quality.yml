
name: JavaScript Validation

on:
  pull_request:
  push:
    branches:
      - main
      - dev1
      - dev2
      - dev3

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file"
            count=$((count + 1))
          done < <(
            find . \
              -type d \( -name node_modules -o -name .git \) -prune -o \
              -type f -name '*.js' -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "::error::No JavaScript files were found."
            exit 1
          fi

          echo "Successfully checked $count JavaScript files."
