name: BSMS Web

on:
  pull_request:
  push:
    branches:
      - main
      - dev1
      - dev2
      - dev3

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check standalone JavaScript files
        shell: bash
        run: |
          set -e
          find . \
            -type d \( -name node_modules -o -name .git \) -prune \
            -o -type f -name '*.js' -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check inline JavaScript in HTML files
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile
          import sys

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.script_type = ""
                  self.lines = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return

                  attrs = dict(attrs)
                  script_type = (attrs.get("type") or "").strip().lower()

                  # Only check classic JavaScript scripts and module scripts.
                  if script_type not in ("", "text/javascript", "application/javascript", "module"):
                      self.in_script = False
                      return

                  # External scripts have no inline code to check.
                  if attrs.get("src"):
                      self.in_script = False
                      return

                  self.in_script = True
                  self.script_type = script_type
                  self.lines = []

              def handle_data(self, data):
                  if self.in_script:
                      self.lines.append(data)

              def handle_entityref(self, name):
                  if self.in_script:
                      self.lines.append(f"&{name};")

              def handle_charref(self, name):
                  if self.in_script:
                      self.lines.append(f"&#{name};")

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      code = "".join(self.lines)
                      if code.strip():
                          self.scripts.append((self.script_type, code))
                      self.in_script = False
                      self.lines = []

          failed = False

          for html_file in Path(".").rglob("*.html"):
              if any(part in {"node_modules", ".git"} for part in html_file.parts):
                  continue

              parser = ScriptParser()
              try:
                  parser.feed(html_file.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, OSError) as error:
                  print(f"Could not read {html_file}: {error}")
                  failed = True
                  continue

              for index, (script_type, code) in enumerate(parser.scripts, start=1):
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      suffix=".mjs" if script_type == "module" else ".js",
                      encoding="utf-8",
                      delete=False
                  ) as temp_file:
                      temp_file.write(code)
                      temp_path = Path(temp_file.name)

                  try:
                      print(f"Checking inline script #{index} in {html_file}")
                      result = subprocess.run(
                          ["node", "--check", str(temp_path)],
                          capture_output=True,
                          text=True
                      )

                      if result.returncode != 0:
                          print(f"JavaScript syntax error in {html_file}, script #{index}:")
                          print(result.stderr)
                          failed = True
                  finally:
                      temp_path.unlink(missing_ok=True)

          if failed:
              sys.exit(1)

          print("All inline JavaScript syntax checks passed.")
          PY
