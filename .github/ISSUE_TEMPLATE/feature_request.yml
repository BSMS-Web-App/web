name: Feature Request
description: Suggest a feature or improvement for BSMS Web.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a new feature or an improvement. Describe the need and the result you would like to see. Do not include secrets or private user data.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of BSMS Web would this affect?
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the current situation and why this feature would be useful.
      placeholder: |
        Example: The chat page currently has no way to...
        Explain the problem, limitation, or opportunity this would address.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe how you would like the feature to work and how we can tell it is complete.
      placeholder: |
        **Suggested behavior**
        Describe what users should be able to do and how it should work.

        **Done when**
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information (optional)
      description: Add mockups, links, technical ideas, related issues, or anything else that may help.
      placeholder: "Link a design, mention a related issue, or share an implementation idea."
