name: Feature Implementation
description: Propose an engineering feature or substantial improvement for BSMS Web.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this for development work that adds or materially changes functionality. Describe the goal and how reviewers can tell it is complete. Do not include secrets or private user data.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Feature proposal
      description: Combine the goal, current problem, and desired behavior.
      placeholder: |
        **Goal**
        What should this feature accomplish?

        **Current problem / context**
        What limitation or need does it address?

        **Proposed behavior**
        How should it work for users and the system?
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Technical approach and completion criteria
      description: Add implementation ideas, affected files or systems, constraints, dependencies, and testable acceptance criteria.
      placeholder: |
        **Implementation notes**
        Relevant files, APIs, data changes, or suggested approach.

        **Done when**
        - [ ] ...
        - [ ] ...
        - [ ] ...

        **Dependencies / risks**
        Related issues, migrations, or compatibility concerns (if any).
