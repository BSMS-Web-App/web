name: Engineering Bug
description: Report a reproducible defect in the codebase or a development deployment.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report defects that need engineering investigation. Include enough detail to reproduce the problem, and never include secrets, passwords, access tokens, or private user data.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Where does it happen?
      description: Include the environment and, if relevant, the branch, commit, or deployment.
      placeholder: "e.g. Production, dev2, commit abc1234, or https://preview.example.com"

  - type: textarea
    id: details
    attributes:
      label: What happens?
      description: Combine the reproduction steps, actual behavior, and expected behavior here.
      placeholder: |
        **Steps to reproduce**
        1. Open...
        2. Select...
        3. Observe...

        **Actual behavior**
        Describe what happens.

        **Expected behavior**
        Describe what should happen instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, and extra context (optional)
      description: Add relevant errors, stack traces, failed requests, screenshots, or investigation notes. Redact sensitive values.
      placeholder: "Paste relevant console/server output or note what you've already investigated."
      render: text
