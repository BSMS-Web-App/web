name: Bug Report
description: Report a problem with BSMS Web.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a problem. Please do not include passwords, access tokens, secrets, or private user data.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of BSMS Web is affected?
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where did the problem happen, and what were you trying to do?
      placeholder: |
        Example: On the production website, I opened the chat page and tried to send a message.
        Include the environment or deployment if relevant (for example, production or dev2).
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain what happened and what you expected to happen.
      placeholder: |
        **Steps to reproduce**
        1. Open...
        2. Click...
        3. ...

        **What happened**
        Describe the problem.

        **What should happen**
        Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information (optional)
      description: Add anything else that could help, such as screenshots, logs, errors, or related issues. Remove private information.
      placeholder: "Paste a relevant error message, add a screenshot, or share a related issue link."
      render: text
