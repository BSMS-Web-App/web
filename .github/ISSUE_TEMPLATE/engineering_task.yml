name: Task
description: Track work that needs to be completed in BSMS Web.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for planned work, such as updates, cleanup, testing, documentation, or infrastructure changes. Do not include secrets or private user data.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of BSMS Web does this task affect?
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work is needed and what it should accomplish.
      placeholder: |
        Example: The account settings code needs cleanup because...
        Describe the current situation and the goal of this task.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the work to do and how completion should be checked.
      placeholder: |
        **Work to complete**
        List the changes, files, or systems involved.

        **Done when**
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information (optional)
      description: Add related issues, links, technical notes, dependencies, or possible risks.
      placeholder: "Mention a blocker, related issue, useful link, or technical detail."
