name: Engineering Task
description: Track maintenance, refactoring, infrastructure, testing, or documentation work.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this for engineering work that is not primarily a bug fix or a new feature. Keep the task focused and explain how completion will be verified. Do not include secrets or private user data.

  - type: dropdown
    id: category
    attributes:
      label: Task category
      options:
        - Refactoring
        - Maintenance
        - Infrastructure / Deployment
        - Security improvement
        - Testing / Quality
        - Performance
        - Documentation
        - Tooling / CI
        - Migration
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Accounts / Authentication
        - Chat / Messaging
        - Games
        - Countdown
        - Contests
        - Frontend / UI
        - Backend / API
        - Database / Data
        - Infrastructure / Deployment
        - Build / Tooling
        - Documentation
        - Repository-wide
        - Other
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Task details
      description: Combine the objective, scope, technical notes, and completion criteria.
      placeholder: |
        **Objective**
        What needs to be done, and why?

        **Scope / technical notes**
        What should change? Include relevant files, systems, constraints, or proposed approach.

        **Completion criteria**
        - [ ] ...
        - [ ] ...

        **Dependencies / risks**
        Note blockers or related issues, if any.
    validations:
      required: true
