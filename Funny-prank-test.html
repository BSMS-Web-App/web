<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Explosion container */
        .explosion-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 3s forwards;
        }

        /* Central flash */
        .flash {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff 0%, #ff8c00 40%, rgba(128, 0, 128, 0) 70%);
            border-radius: 50%;
            animation: explodeFlash 3s forwards;
        }

        /* Particle styles */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explodeParticle 3s cubic-bezier(0.1, 1, 0.3, 1) forwards;
        }

        @keyframes explodeFlash {
            0% {
                transform: scale(0.1);
                opacity: 1;
            }
            20% {
                transform: scale(15);
                opacity: 0.9;
            }
            100% {
                transform: scale(30);
                opacity: 0;
            }
        }

        @keyframes explodeParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="explosion-container" id="explosion">
        <div class="flash"></div>
    </div>

    <script>
        // Generate explosion particles dynamically
        const container = document.getElementById('explosion');
        const particleCount = 80; // Number of particles
        
        const colors = ['#ff5500', '#ff8c00', '#ffa500', '#800080', '#9400d3', '#4b0082', '#ff00ff'];

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random angle and distance for explosion spread
            const angle = Math.random * Math.PI * 2;
            const distance = 200 + Math.random() * 800; // pixels to travel
            
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            
            // Random size variation
            const size = 6 + Math.random() * 14;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Random orange/purple color
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Add glow effect
            particle.style.boxShadow = `0 0 ${Math.random() * 15 + 5}px ${particle.style.backgroundColor}`;

            container.appendChild(particle);
        }

        // Redirect after exactly 3 seconds
        setTimeout(() => {
            window.location.href = "https://bsms-web.vercel.app";
        }, 3000);
    </script>

</body>
</html>
