<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verity Quest — 20-Level Platformer</title>
<style>
:root{color-scheme:dark;--ink:#fff8dc;--panel:rgba(12,18,35,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{background:radial-gradient(ellipse at 50% 0%,#26335f 0%,#101426 70%) fixed #101426}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.game-wrap{width:min(100%,1000px)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.25rem,3vw,2rem);background:linear-gradient(90deg,#ffe55c,#ff9ad5);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill,button{border:1px solid #ffffff2e;background:linear-gradient(180deg,#ffffff14,#ffffff05),var(--panel);backdrop-filter:blur(8px);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;box-shadow:0 4px 14px #0004}
button{cursor:pointer;transition:transform .12s,background .12s}
button:hover{background:#35415e;transform:translateY(-1px)}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#1a2541;border:2px solid #ffffff35;border-radius:16px;box-shadow:0 18px 60px #0006}
.under{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.help{color:#c9d4f0;font-size:.92rem;line-height:1.5}
.help kbd{background:#ffffff18;border:1px solid #ffffff35;padding:2px 6px;border-radius:5px;color:#fff}
.message{color:#ffe68b;min-height:1.5em;font-weight:650}
.mobile{display:none;gap:10px;justify-content:space-between;margin-top:12px}
.mobile button{flex:1;font-size:1.2rem;touch-action:none;user-select:none}
canvas{border-color:#ffffff4d;box-shadow:0 0 0 4px #ffffff0d,0 18px 60px #000a}
.message{background:#ffffff0d;padding:8px 14px;border-radius:12px}
.game-wrap:fullscreen{width:100vw;max-width:none;height:100vh;padding:12px;background:#101426;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.game-wrap:fullscreen canvas{width:min(100%,calc((100vh - 160px)*16/9));margin:0 auto}
@media(max-width:650px){body{padding:10px}.mobile{display:flex}.help{font-size:.82rem}}
</style>
</head>
<body>
<div class="game-wrap">
<header>
 <h1>😀 Verity Quest</h1>
 <div class="hud">
  <span class="pill" id="levelLabel">Level 1 / 20</span>
  <span class="pill" id="objective">Reach the flag!</span>
  <span class="pill" id="deaths">💥 0</span>
  <button id="restartBtn">↻ Restart</button>
  <button id="soundBtn">🔊 Sound on</button>
  <button id="fsBtn">⛶ Fullscreen</button>
  <button id="musicBtn">🎵 Music on</button>
 </div>
</header>
<canvas id="game" width="960" height="540" aria-label="Verity Quest platform game"></canvas>
<div class="under">
 <div class="help">Move <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> · Jump <kbd>Space</kbd>/<kbd>↑</kbd>/<kbd>W</kbd> · Restart <kbd>R</kbd><br>
 Beware spikes, spiky floaters, moving and crumbling platforms. Grab the glowing orb on marked levels!</div>
 <div class="message" id="message" aria-live="polite">Ready, little smiley? Let's go!</div>
</div>
<div class="mobile"><button id="leftBtn">◀</button><button id="jumpBtn">⬆ Jump</button><button id="rightBtn">▶</button></div>
</div>
<script>
(()=>{
// Compatibility: older browsers lack roundRect, which would stop the whole game from drawing.
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
window.addEventListener('error',e=>{const m=document.getElementById('message');if(m)m.textContent='Error: '+e.message});
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=540,groundY=490;
const themes=[
{name:'Candy Meadow',sky:'#80dcff',far:'#65c5aa',ground:'#4fbd72',accent:'#ff75ad'},
{name:'Moonlit Ruins',sky:'#111b45',far:'#293b70',ground:'#555c89',accent:'#b9a4ff'},
{name:'Volcano Run',sky:'#351b35',far:'#733b45',ground:'#8c4240',accent:'#ffb34f'},
{name:'Crystal Cavern',sky:'#172b55',far:'#2f6d91',ground:'#347f91',accent:'#76fff1'},
{name:'Cloud Kingdom',sky:'#b6e7ff',far:'#9eb6f6',ground:'#c9bff0',accent:'#ffb9ef'},
{name:'Jungle Temple',sky:'#164b4a',far:'#24715a',ground:'#5b8a48',accent:'#f5d65f'},
{name:'Neon City',sky:'#160f38',far:'#38256c',ground:'#292c63',accent:'#ff57d6'},
{name:'Frozen Lake',sky:'#bdeaff',far:'#79bad9',ground:'#8fd0e8',accent:'#4c83ff'},
{name:'Desert Mirage',sky:'#ffc77f',far:'#e99b66',ground:'#bc824c',accent:'#fff06a'},
{name:'Clockwork',sky:'#29334a',far:'#56617a',ground:'#9c875d',accent:'#ffce72'},
{name:'Star Garden',sky:'#10172f',far:'#25375b',ground:'#385f70',accent:'#c6ff8e'},
{name:'Mushroom Woods',sky:'#a5d8ff',far:'#6d9c8c',ground:'#668d59',accent:'#ff8f9b'},
{name:'Deep Sea',sky:'#052e54',far:'#075b7c',ground:'#13839a',accent:'#6cf4f2'},
{name:'Autumn Ridge',sky:'#eaa16c',far:'#a65b54',ground:'#845647',accent:'#ffd27a'},
{name:'Paper World',sky:'#fff1c9',far:'#e9c7a0',ground:'#a5c7a4',accent:'#ef8a9b'},
{name:'Storm Peaks',sky:'#343d59',far:'#555e77',ground:'#778397',accent:'#fff1a0'},
{name:'Honey Hive',sky:'#ffd66c',far:'#f0a944',ground:'#bd8532',accent:'#fff7b3'},
{name:'Dreamscape',sky:'#6f6bdc',far:'#a27fe0',ground:'#5d70bd',accent:'#ffb4ed'},
{name:'Final Galaxy',sky:'#080b27',far:'#25215c',ground:'#403d80',accent:'#7cf7ff'},
{name:'Hell',sky:'#1a0000',far:'#5a0a05',ground:'#4a1a14',accent:'#ff5a1f'}];
const $=id=>document.getElementById(id);
const levelLabel=$('levelLabel'),objective=$('objective'),message=$('message'),deathsEl=$('deaths');
let level=0,platforms=[],hazards=[],enemies=[],orb=null,flag=null,hasOrb=false,particles=[],keys={},won=false;
let sound=true,audioCtx=null,T=0,shake=0,deaths=0,coyote=0,banner=0;
const player={x:38,y:460,w:30,h:30,vx:0,vy:0,onGround:false,face:1};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function beep(f=520,d=.07,type='sine'){if(!sound)return;try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function burst(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:35,color,size:2+Math.random()*4})}

// Every level is generated from its number: a chain of reachable platforms that
// zig-zags around the screen, so layout and flag position differ each level.
// Precise jump reach (px) for a given rise, from the real jump physics.
const reach=rise=>{const q=134.56-.96*rise;return q<0?0:4.2*(11.6+Math.sqrt(q))/.48+24};
// Levels are 1-3 horizontal "lanes" stacked in separate height bands (so platforms never overlap),
// snaking right, then left, then right. Gaps are a fixed fraction of the max jump, so late levels
// demand near pixel-perfect, Geometry-Dash-style timing.
function loadLevel(n){
 level=n;const r=rng(n*7919+101),d=n/19;
 const orbLevel=(n+1)%3===0||n===19,rows=n<2?1:n<7?2:3,lo=[380,265,160],hi=[440,335,230];
 platforms=[{x:0,y:groundY,w:150,h:50,t:0}];
 hazards=[];enemies=[];particles=[];hasOrb=false;won=false;
 const chain=[];let prev={x:0,y:groundY,w:150};
 for(let row=0;row<rows;row++){
  const dir=row%2?-1:1,lastRow=row===rows-1;let k=0;
  while(k<12){
   const w=Math.round(110-d*55+r()*20),first=k===0;
   let y=first?clamp(prev.y-(row?85:70),lo[row],hi[row]):clamp(prev.y+(r()-.5)*2*(20+d*45),lo[row],hi[row]);
   y=Math.max(y,prev.y-105);
   const gap=Math.max(35,reach(prev.y-y)*(first?.35:.42+.4*d+r()*.04));
   const x=dir>0?prev.x+prev.w+gap:prev.x-gap-w;
   if(x<12||x+w>W-12||(lastRow&&dir<0&&k>0&&x<230))break;
   const p={x,y,w,h:18,t:1,edge:first};platforms.push(p);chain.push(p);prev=p;k++;
   if(lastRow&&k>=3&&r()<.2)break;
  }
  chain[chain.length-1].edge=1;
 }
 const last=chain.length-1,orbIdx=orbLevel?Math.floor(last/2):-1;
 chain.forEach((p,i)=>{
  if(p.edge||i===orbIdx)return;
  const q=r();
  if(n>=4&&q<.28){p.bx=p.x;p.amp=22+d*18;p.sp=.02+r()*.015;p.ph=r()*6;p.dx=0}
  else if(n>=7&&q<.53){p.cr=1;p.ct=0}
  else if(n>=1&&p.w>=70&&r()<.3+.4*d)hazards.push({x:p.x+p.w/2-12,y:p.y-18,w:24,h:18});
 });
 // patrolling floaters that pace across a platform
 for(let c=0,tries=0;n>=5&&c<Math.min(5,Math.floor((n-2)/3))&&tries<60;tries++){
  const i=Math.floor(r()*chain.length),p=chain[i];
  if(p.edge||p.amp||p.cr||p.w<72||i===orbIdx||hazards.some(h=>h.y===p.y-18&&h.x>=p.x&&h.x<=p.x+p.w))continue;
  enemies.push({cx:p.x+p.w/2,cy:p.y-14,amp:(p.w/2-14)/1.6,ph:r()*6,sp:.035+d*.03,hz:true});c++;
 }
 // floaters hovering mid-gap, right at the top of the jump arc
 for(let c=0,tries=0;n>=3&&c<Math.min(7,1+Math.floor(n/3))&&tries<60;tries++){
  const i=Math.floor(r()*last),a=chain[i],b=chain[i+1];
  if(Math.abs(a.y-b.y)>60)continue;
  enemies.push({cx:(a.x+a.w/2+b.x+b.w/2)/2,cy:Math.min(a.y,b.y)-110,amp:40,ph:r()*6,sp:.03+d*.03,hz:n>=12&&c%2===0});c++;
 }
 const fp=chain[last];
 flag={x:fp.x+fp.w/2-4,y:fp.y-58,w:24,h:58};
 const op=chain[orbIdx];
 orb=orbLevel?{x:op.x+op.w/2,y:op.y-30,r:11}:null;
 respawn();
 levelLabel.textContent=`Level ${n+1} / 20 · ${themes[n].name}`;
 objective.textContent=orb?'Puzzle: collect the glow-orb':'Reach the flag!';
 message.textContent=orb?'The flag is sealed! Find the glowing orb.':(n>=6?'Time your jumps. No mercy!':'Precision matters. Find the flag!');banner=140;if(n===19)message.textContent='Welcome to Hell. The ground trembles... find the orb!';
}
function respawn(){player.x=38;player.y=groundY-player.h;player.vx=player.vy=0}
function die(msg){deaths++;deathsEl.textContent='💥 '+deaths;shake=12;burst(player.x+15,player.y+15,'#ffdf38',24);beep(130,.18,'sawtooth');message.textContent=msg;respawn()}
const reset=()=>loadLevel(level);
const rects=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function update(){
 T++;
 musicTick();
 if(shake>0)shake--;
 if(banner>0)banner--;
 if(level===19&&!won&&T%240===0){shake=20;beep(60,.4,'sawtooth')}
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});particles=particles.filter(p=>p.life>0);
 if(won)return;
 for(const p of platforms){
  if(p.amp){const nx=p.bx+Math.sin(T*p.sp+p.ph)*p.amp;p.dx=nx-p.x;p.x=nx}
  if(p.cr){if(p.gone){if(--p.rt<=0){p.gone=false;p.ct=0}}else if(p.ct>0&&++p.ct>35){p.gone=true;p.rt=150;burst(p.x+p.w/2,p.y,'#ccc',10)}}
 }
 const left=keys.ArrowLeft||keys.a||keys.A,right=keys.ArrowRight||keys.d||keys.D,jump=keys[' ']||keys.ArrowUp||keys.w||keys.W;
 player.vx=left?-4.2:right?4.2:player.vx*.78;
 if(left)player.face=-1;if(right)player.face=1;
 coyote=player.onGround?4:coyote-1;
 if(jump&&coyote>0){player.vy=-11.6;player.onGround=false;coyote=0;burst(player.x+15,player.y+30,'#fff',5);beep(380,.06)}
 player.vy=Math.min(player.vy+.48,13);
 player.x=clamp(player.x+player.vx,0,W-player.w);
 player.y+=player.vy;player.onGround=false;
 for(const p of platforms){
  if(p.gone)continue;
  if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy<=p.y+4){
   player.y=p.y-player.h;player.vy=0;player.onGround=true;
   if(p.dx)player.x=clamp(player.x+p.dx,0,W-player.w);
   if(p.cr&&p.ct===0)p.ct=1;
  }
 }
 for(const h of hazards)if(rects(player,{x:h.x+4,y:h.y+4,w:h.w-8,h:h.h-4}))die('Ouch! Spikes! Try again.');
 for(const e of enemies){
  const s=Math.sin(T*e.sp+e.ph)*e.amp;e.x=e.cx+(e.hz?s*1.6:0);e.y=e.cy+(e.hz?0:s);
  if(Math.hypot(player.x+15-e.x,player.y+15-e.y)<24)die('Bonk! The floater got you.');
 }
 if(player.y>H+60)die('Whoops! Into the abyss. Back to the start.');
 if(orb&&!hasOrb&&Math.hypot(player.x+15-orb.x,player.y+15-orb.y)<29){
  hasOrb=true;burst(orb.x,orb.y,themes[level].accent,22);message.textContent='Orb collected! The flag is unlocked!';objective.textContent='Puzzle solved ✓';beep(760,.18);
 }
 if(rects(player,flag)){
  if(orb&&!hasOrb)message.textContent='The flag is locked — find the glowing orb!';
  else{won=true;burst(flag.x,flag.y,themes[level].accent,45);beep(680,.1);setTimeout(()=>beep(900,.16),100);
   message.textContent=level===19?'YOU DID IT! All 20 levels conquered! 🎉':'Level cleared! On to the next world! ✨';objective.textContent='Level complete ✓'}
 }
}

function drawBackground(t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,t.sky);g.addColorStop(1,t.far);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.22;ctx.fillStyle=t.accent;ctx.beginPath();ctx.arc(780-level*6,110,60,0,7);ctx.fill();
 ctx.globalAlpha=1;
 for(let i=0;i<40;i++){
  const x=((i*137+level*41-T*(.1+i%3*.05))%W+W)%W,y=(i*71+level*29)%330;
  ctx.globalAlpha=.25+.3*Math.abs(Math.sin(T*.02+i));ctx.fillStyle=i%3===0?t.accent:'#fff';
  ctx.beginPath();ctx.arc(x,y,1.2+i%3,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;
 for(let layer=0;layer<3;layer++){
