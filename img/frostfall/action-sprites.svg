    Frostfall icon sprites — 4 columns x 4 rows of 32x32 cells.
    Row 1: sword, skills sparkle, guard shield, cocoa mug
    Row 2: run boot, HP heart, SP bolt, BP badge
    Row 3: hero portrait, touch press (cells 3-4 are empty)
    Row 4: narrator star, Mayor Bram, Pip, cracked shard
