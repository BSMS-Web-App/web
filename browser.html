<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/api-origin.js"></script>
  <script src="/js/browser-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#BB001E">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Browse public websites through BSMS Web Browser.">
  <title>Web Browser — BSMS Web</title>
  <link rel="icon" href="/img/icon.png">
  <link rel="apple-touch-icon" href="/img/app-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/browser.css">
  <script defer src="/js/browser.js"></script>
</head>
<body>
  <main class="browser-shell" id="browserShell">
    <header class="browser-header" id="browserHeader">
      <a class="brand" href="/" aria-label="BSMS Web home">
        <img src="/img/icon.png" alt="">
        <span>BSMS Web</span>
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <span class="product-label">Web Browser</span>
      <span class="header-spacer"></span>
      <button id="collapseHeaderButton" class="header-toggle" type="button" aria-label="Hide browser header" title="Hide header">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </header>

    <section class="browser-toolbar" aria-label="Browser controls">
      <button id="expandHeaderButton" class="header-toggle expand-toggle" type="button" aria-label="Show browser header" title="Show header" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <div class="nav-controls">
        <button id="backButton" class="icon-button" type="button" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="forwardButton" class="icon-button" type="button" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button id="reloadButton" class="icon-button" type="button" aria-label="Reload" title="Reload">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i>
        </button>
      </div>

      <form id="addressForm" class="address-form">
        <svg class="address-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <div id="addressInput" class="address-input" role="textbox" aria-label="Website address" aria-multiline="false"
          contenteditable="true" inputmode="url" spellcheck="false" data-placeholder="Enter any website address"></div>
        <button id="goButton" type="submit">Go</button>
      </form>
    </section>

    <section class="content-frame">
      <div id="emptyState" class="empty-state">
        <div class="empty-mark" aria-hidden="true"><img src="/img/icon.png" alt=""></div>
        <h1>Explore the web.</h1>
        <p class="empty-description">Enter a website address to get started.</p>
        <a class="signin-link" href="/accounts" id="signinLink" hidden>Open account sign-in</a>
      </div>
      <iframe id="browserFrame" title="Website content" sandbox="allow-scripts allow-forms allow-downloads allow-popups" referrerpolicy="no-referrer" hidden></iframe>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
