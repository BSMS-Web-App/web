<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="description" content="Compete in the BSMS Web Halloween Haunt! Collect candy, upgrade your crew, and climb the leaderboard."/>
<meta name="theme-color" content="#030303">
<meta name="color-scheme" content="dark">
<title>Halloween Haunt - BSMS Web</title>

<!-- Existing Core Scripts -->
<script src="/js/ban-check.js"></script>
<script src="/js/account-check.js"></script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2TKPQV995W"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2TKPQV995W');

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
:root {
  --red:#BB001E; --red-hot:#D10022; --red-glow:rgba(187,0,30,.38);
  --orange:#FF7A18; --orange-glow:rgba(255,122,24,.22);
  --bg:#030303; --surface:#0a0a0a; --surface-raised:rgba(18,18,20,.82);
  --fg:#fff; --fg2:rgba(255,255,255,.72); --border:rgba(255,255,255,.1);
  --glass-bg:rgba(15,15,15,.66); --glass-border:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.5); --font:'Patrick Hand',cursive;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;width:100%;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--fg);font:20px/1.45 var(--font);padding:105px 18px 125px}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(187,0,30,.12),transparent 52%),radial-gradient(ellipse at 85% 85%,rgba(255,122,24,.055),transparent 40%)}
.ambient-particles{position:fixed;inset:0;z-index:-1;opacity:.18;pointer-events:none;background-image:radial-gradient(var(--red-glow) 1px,transparent 1.5px);background-size:60px 60px;transform:perspective(1000px) rotateX(60deg) translateY(-100px) translateZ(-200px);animation:moveParticles 22s linear infinite;mask-image:linear-gradient(to bottom,transparent,black 40%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,black 40%,transparent)}
@keyframes moveParticles{from{background-position:0 0}to{background-position:0 120px}}
#offlineBanner{position:fixed;top:0;left:0;width:100%;background:var(--red-hot);color:#fff;text-align:center;padding:10px;z-index:10000;transform:translateY(-110%);transition:transform .3s}
#offlineBanner.show{transform:translateY(0)}
.haunt-header{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1200px,calc(100% - 28px));padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--glass-bg);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--glass-shadow);z-index:100}
.header-brand h1{font:inherit;font-size:clamp(23px,3vw,31px);font-weight:bold;color:#fff;letter-spacing:.3px;text-shadow:0 0 22px var(--red-glow)}
.header-brand h1::first-letter{color:var(--red-hot)}
.header-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stat-pill{background:rgba(255,255,255,.045);border:1px solid var(--border);padding:7px 13px;border-radius:14px;font-size:19px;color:var(--fg2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.stat-pill span.cash{color:#fff;font-weight:bold}
.stat-pill span.timer{color:#ff6478;font-size:17px}
.game-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 220px);width:100%;position:relative;isolation:isolate}
.basket-wrapper{position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .12s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 18px 45px rgba(187,0,30,.16));touch-action:manipulation}
.basket-wrapper:hover{transform:translateY(-4px) scale(1.025)}
.basket-wrapper:active{transform:scale(.96) translateY(4px)}
.pumpkin-svg{width:clamp(190px,30vw,290px);height:auto;max-height:290px}
.basket-status{text-align:center;margin-top:5px;font-size:23px;color:var(--fg2);min-width:min(320px,90vw)}
.basket-bar-bg{width:min(280px,80vw);height:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin:10px auto;overflow:hidden}
.basket-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff5268);width:0%;transition:width .25s;box-shadow:0 0 14px var(--red-glow)}
.action-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:calc(100vw - 24px);background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);padding:9px;border-radius:22px;box-shadow:0 10px 45px rgba(0,0,0,.7);z-index:100;flex-wrap:wrap;justify-content:center}
.action-btn{background:transparent;border:1px solid transparent;color:var(--fg2);font:inherit;font-size:18px;cursor:pointer;padding:8px 13px;border-radius:13px;transition:background .2s,color .2s,border-color .2s}
.action-btn:hover,.action-btn:focus-visible,.action-btn.active{background:rgba(187,0,30,.16);border-color:rgba(187,0,30,.35);color:#fff;outline:none}
.falling-candy{position:absolute;width:40px;height:40px;object-fit:contain;pointer-events:none;z-index:50;animation:candyDrop 1.2s cubic-bezier(.3,0,.7,1) forwards}
@keyframes candyDrop{0%{transform:translateY(-50px) scale(.5) rotate(0);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.2) rotate(45deg)}100%{transform:translateY(150px) scale(.8) rotate(180deg);opacity:0}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:2000;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.modal-overlay.show{opacity:1;visibility:visible}
.haunt-modal{background:rgba(10,10,11,.96);border:1px solid var(--glass-border);border-radius:24px;width:min(1050px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;box-shadow:0 25px 90px rgba(0,0,0,.75),0 0 35px rgba(187,0,30,.08);transform:translateY(14px) scale(.99);transition:transform .22s;overflow:hidden}
.modal-overlay.show .haunt-modal{transform:translateY(0) scale(1)}
.modal-header{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,.025)}
.modal-header h2{font:inherit;font-size:27px;font-weight:bold;color:#fff;letter-spacing:.2px}
.modal-header h2::first-letter{color:var(--red-hot)}
.modal-close{background:rgba(255,255,255,.04);border:1px solid var(--border);width:38px;height:38px;border-radius:12px;color:var(--fg2);font:inherit;font-size:27px;cursor:pointer;transition:all .2s}
.modal-close:hover{background:rgba(187,0,30,.16);color:#fff;border-color:rgba(187,0,30,.4)}
.modal-body{padding:22px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}
.candy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.candy-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;overflow-wrap:anywhere}
.candy-card:hover{transform:translateY(-2px);border-color:rgba(187,0,30,.5);background:rgba(187,0,30,.055)}
.candy-card.locked img{filter:brightness(0) opacity(.3)}
.candy-card img{width:62px;height:62px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.candy-card .qty{font-size:16px;color:var(--fg2)}
.upgrade-list{display:flex;flex-direction:column;gap:12px}
.upgrade-row{display:flex;justify-content:space-between;align-items:center;gap:16px;background:rgba(255,255,255,.025);padding:16px;border-radius:16px;border:1px solid var(--border)}
.buy-btn{background:linear-gradient(135deg,var(--red),#820014);color:#fff;border:1px solid rgba(255,255,255,.1);padding:9px 18px;border-radius:13px;font:inherit;font-size:18px;cursor:pointer;box-shadow:0 5px 18px rgba(187,0,30,.2);transition:transform .15s,filter .15s;white-space:nowrap}
.buy-btn:hover{filter:brightness(1.13);transform:translateY(-1px)}
.buy-btn:active{transform:scale(.97)}
.buy-btn:disabled{background:#242426;color:#777;box-shadow:none;cursor:not-allowed;transform:none}
#toast-container{position:fixed;top:92px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;width:min(370px,calc(100vw - 36px));pointer-events:none}
#gameLoadingScreen{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(3,3,3,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:opacity .3s,visibility .3s}
#gameLoadingScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-card{width:min(430px,100%);padding:30px 24px;text-align:center;background:rgba(18,18,20,.9);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 20px 80px rgba(0,0,0,.7),0 0 35px rgba(187,0,30,.12)}
.loading-mark{width:54px;height:54px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.12);border-top-color:var(--red-hot);border-radius:50%;animation:hauntSpin .8s linear infinite}
.loading-card h2{font-size:27px;margin-bottom:8px}
.loading-card p{font-size:18px;color:var(--fg2)}
.loading-retry{margin-top:16px;background:linear-gradient(135deg,var(--red),#820014);border:0;border-radius:12px;padding:10px 18px;color:white;font:inherit;font-size:18px;cursor:pointer}
.loading-retry[hidden]{display:none}
#collectRetry{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);z-index:150;background:var(--red);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:9px 14px;color:#fff;font:inherit;font-size:16px;box-shadow:0 8px 24px #0008}
#collectRetry[hidden]{display:none}
@keyframes hauntSpin{to{transform:rotate(360deg)}}
.toast{background:rgba(12,12,14,.96);backdrop-filter:blur(18px);border:1px solid var(--border);border-left:4px solid var(--red-hot);padding:12px 17px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#fff;font-size:18px;animation:slideIn .25s ease-out forwards}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
button,select,input{font-family:var(--font)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ff6478;outline-offset:2px}
table{border-collapse:collapse}
th,td{padding:9px 8px}
@media(max-width:760px){
 body{padding:125px 10px 165px}
 .haunt-header{top:8px;width:calc(100% - 16px);padding:10px 12px;align-items:flex-start;flex-direction:column;gap:8px;border-radius:18px}
 .header-stats{justify-content:flex-start;gap:7px;width:100%}
 .stat-pill{font-size:17px;padding:5px 9px}
 .stat-pill span.timer{font-size:15px}
 .game-container{min-height:calc(100vh - 280px)}
 .action-nav{bottom:8px;width:calc(100% - 16px);max-width:none;border-radius:18px;padding:7px;gap:4px}
 .action-btn{font-size:16px;padding:7px 10px}
 .modal-overlay{padding:8px}
 .haunt-modal{max-height:calc(100dvh - 16px);border-radius:19px}
 .modal-header{padding:13px 15px}
 .modal-body{padding:14px}
 .candy-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
 .upgrade-row{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="gameLoadingScreen" role="status" aria-live="polite">
  <div class="loading-card">
    <div class="loading-mark" aria-hidden="true"></div>
    <h2>Halloween Haunt</h2>
    <p id="loadingMessage">Loading your game, shops, collection, and candy artwork…</p>
    <button id="loadingRetry" class="loading-retry" hidden onclick="window.retryHalloweenHauntLoad()">Retry loading</button>
  </div>
</div>
<button id="collectRetry" hidden onclick="window.retryHalloweenHauntCollect()">Retry saving candy clicks</button>

<div id="offlineBanner" style="position:fixed;top:0;width:100%;background:#D10022;color:#fff;text-align:center;padding:8px;z-index:9999;display:none;">You are currently offline.</div>

<!-- Ambient BG -->
<div class="ambient-particles"></div>

<header class="haunt-header">
  <div class="header-brand">
    <h1 style="cursor:pointer;" onclick="window.location.href='/'">Halloween Haunt</h1>
  </div>
  <div class="header-stats">
    <div class="stat-pill">Ends in: <span class="timer" id="ui-timer">00:00:00</span></div>
    <div class="stat-pill">Cash: <span class="cash" id="ui-cash">$0</span></div>
  </div>
</header>

<main class="game-container">
  <div class="basket-wrapper" id="basketHitbox" role="button" tabindex="0" aria-label="Collect candy by clicking the pumpkin" onclick="handleBasketClick(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleBasketClick(event)}">
    <svg viewBox="0 0 100 100" class="pumpkin-svg">
       <ellipse cx="50" cy="55" rx="40" ry="35" fill="#FF7A18" stroke="#D95C00" stroke-width="4"/>
       <path d="M45,20 Q50,10 60,15 L55,25 Z" fill="#2E7D32"/>
       <polygon points="35,45 45,60 25,60" fill="#120D18"/>
       <polygon points="65,45 75,60 55,60" fill="#120D18"/>
       <path d="M30,70 Q50,85 70,70 Q60,75 50,75 Q40,75 30,70 Z" fill="#120D18"/>
    </svg>
  </div>
  <div class="basket-status">
    <div>Basket: <span id="ui-capacity-text">0 / 50</span></div>
    <div class="basket-bar-bg"><div class="basket-bar-fill" id="ui-capacity-bar"></div></div>
  </div>
</main>

<div class="action-nav">
  <button class="action-btn" onclick="openModal('shops')">Shops</button>
  <button class="action-btn" onclick="openModal('upgrades')">Upgrades</button>
  <button class="action-btn" onclick="openModal('crew')">Crew</button>
  <button class="action-btn" onclick="openModal('index')">Candy Index</button>
  <button class="action-btn" onclick="openModal('stats')">Stats</button>
  <button class="action-btn" onclick="openModal('leaderboard')">Leaderboard</button>
</div>

<!-- Modal Templates (Content injected by JS) -->
<div id="hauntModalOverlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="haunt-modal">
    <div class="modal-header">
      <h2 id="modalTitle">Title</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Content -->
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Contest Logic script -->
<script src="/js/halloween-haunt.js"></script>

</body>
</html>
