<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse active community members, discover friends, and connect across BSMS Web.">
    <title>Users Directory | BSMS Web</title>

    <script src="/js/ban-check.js"></script>
    <script src="/js/account-check.js"></script>

        gtag('js', new Date());
        gtag('config', 'G-2TKPQV995W');

    <script src="/js/analytics.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg: #090a0d;
            --surface: #12141a;
            --surface-hover: #191c24;
            --panel: #161820;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(187, 0, 30, 0.4);
            --fg: #ffffff;
            --fg2: rgba(255, 255, 255, 0.65);
            --accent: #BB001E;
            --accent-hover: #D10022;
            --accent-glow: rgba(187, 0, 30, 0.35);
            --owner: #9333ea;
            --admin: #dc2626;
            --mod: #eab308;
            --dev: #737373;
            --verified: #3b82f6;
            --success: #22c55e;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-brand: 'Patrick Hand', cursive;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(187, 0, 30, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 50%, rgba(87, 101, 242, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* App Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(18, 20, 26, 0.75);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--fg);
        }

        .brand-badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-title {
            font-family: var(--font-brand);
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--fg2);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: var(--font);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        /* Container */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .page-intro {
            margin-bottom: 28px;
            text-align: center;
        }

        .page-intro h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-intro h1 span {
            color: var(--accent);
        }

        .page-intro p {
            color: var(--fg2);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search & Filter Toolbar */
        .toolbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--fg2);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--fg);
            font-size: 0.95rem;
            font-family: var(--font);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(187, 0, 30, 0.2);
        }

        .filter-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--fg2);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .filter-chip:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        /* User Grid */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .user-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .avatar-wrap {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #64748b;
            border: 2px solid var(--surface);
        }

        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .display-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .display-name:hover {
            text-decoration: underline;
        }

        .username {
            font-size: 0.9rem;
            color: var(--fg2);
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-bio {
            color: var(--fg2);
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.7em;
        }

        .user-stats {
            display: flex;
            gap: 16px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--fg2);
        }

        .stat-item strong {
            color: var(--fg);
            font-weight: 700;
        }

        .user-card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .user-card-actions .btn {
            flex: 1;
        }

        /* Badge Badging Styles */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .badge:hover {
            transform: scale(1.05);
        }

        .badge.owner {
            background: var(--owner);
            color: #fff;
        }

        .badge.admin {
            background: var(--admin);
            color: #fff;
        }

        .badge.mod {
            background: var(--mod);
            color: #000;
            font-weight: 800;
        }

        .badge-dev {
            width: 18px;
            height: 18px;
            background: var(--dev);
            transform: rotate(45deg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            margin-left: 2px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .badge-dev:hover {
            transform: rotate(45deg) scale(1.15);
        }

        .badge-dev svg {
            width: 11px;
            height: 11px;
            fill: #fff;
            transform: rotate(-45deg);
        }

        .badge-verified {
            width: 18px;
            height: 18px;
            fill: var(--verified);
            cursor: pointer;
            display: inline-block;
            vertical-align: middle;
            transition: transform 0.15s;
        }

        .badge-verified:hover {
            transform: scale(1.15);
        }

        /* Overlay / Modal */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            padding: 28px;
            position: relative;
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--fg2);
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
            padding: 4px;
        }

        .modal-close:hover {
            color: #fff;
        }

        /* Loading & Empty States */
        .state-container {
            text-align: center;
            padding: 80px 20px;
            color: var(--fg2);
        }

        .state-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Container */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: none;
            color: var(--fg);
            font-size: 0.95rem;
            align-items: center;
            gap: 10px;
        }

        #toastContainer.show {
            display: flex;
            animation: toastIn 0.25s ease;
        }

        #toastContainer.error {
            border-color: #ef4444;
            color: #f87171;
        }

        #toastContainer.success {
            border-color: var(--success);
            color: #4ade80;
        }

        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }
            nav {
                display: none;
            }
            .user-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="brand-link">
        <span class="brand-badge">BSMS</span>
        <span class="brand-title">Community</span>
    </a>
    <nav>
        <a href="/">Home</a>
        <a href="/chat">Chat</a>
        <a href="/users" class="active">Users</a>
        <a href="/accounts">Accounts</a>
        <a href="/g">Games</a>
        <a href="/bug-report">Bug Report</a>
    </nav>
    <div class="header-actions">
        <a href="/chat" class="btn btn-secondary btn-sm">Open Chat</a>
        <div id="currentUserPfp" class="avatar-wrap" style="width:38px; height:38px; font-size:1rem;" onclick="location.href='/accounts'">?</div>
    </div>
</header>

<main>
    <div class="page-intro">
        <h1>Discover <span>BSMS Members</span></h1>
        <p>Explore profiles, build your network, follow classmates, and initiate direct messages across the school community.</p>
    </div>

    <div class="toolbar">
        <div class="search-row">
            <div class="search-input-wrap">
                <svg><use href="#ico-search"></use></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, @username, or keyword..." oninput="UsersApp.onSearch(this.value)">
            </div>
            <button class="btn btn-secondary btn-sm" onclick="UsersApp.fetchUsers()">
                Refresh List
            </button>
        </div>
        <div class="filter-tags">
            <button class="filter-chip active" onclick="UsersApp.setFilter('all', this)">All Accounts (<span id="count-all">0</span>)</button>
            <button class="filter-chip" onclick="UsersApp.setFilter('team', this)">BSMS Web Team (<span id="count-team">0</span>)</button>
            <button class="filter-chip" onclick="UsersApp.setFilter('following', this)">Following (<span id="count-following">0</span>)</button>
            <button class="filter-chip" onclick="UsersApp.setFilter('verified', this)">Verified</button>
        </div>
    </div>

    <!-- Active Users Grid -->
    <div id="usersGrid" class="user-grid">
        <div class="state-container" style="grid-column: 1 / -1;">
            <div class="state-spinner"></div>
            <p>Loading active BSMS Web users...</p>
        </div>
    </div>
</main>

<!-- User Profile Modal -->
<div id="profileModal" class="overlay" onclick="if(event.target===this) UsersApp.closeProfileModal()">
    <div class="modal">
        <button class="modal-close" onclick="UsersApp.closeProfileModal()">&times;</button>
        <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; margin-bottom:20px;">
            <div id="modalAvatar" class="avatar-wrap" style="width:84px; height:84px; font-size:2rem;"></div>
            <div>
                <div id="modalNameRow" class="name-row" style="justify-content:center; font-size:1.3rem;"></div>
                <div id="modalUsername" class="username" style="font-size:1rem;"></div>
            </div>
        </div>

        <div id="modalBio" style="color:var(--fg2); font-size:0.95rem; line-height:1.6; text-align:center; margin-bottom:20px; min-height:40px;"></div>

        <div style="display:flex; justify-content:space-around; background:rgba(0,0,0,0.25); border-radius:var(--radius-md); padding:12px; margin-bottom:24px;">
            <div style="text-align:center; cursor:pointer;" onclick="UsersApp.openListModal('followers')" title="Click to view followers">
                <div id="modalFollowersCount" style="font-size:1.2rem; font-weight:800; color:var(--fg);">0</div>
                <div style="font-size:0.8rem; color:var(--fg2); text-decoration:underline; text-underline-offset:2px;">Followers</div>
            </div>
            <div style="text-align:center; cursor:pointer;" onclick="UsersApp.openListModal('following')" title="Click to view following">
                <div id="modalFollowingCount" style="font-size:1.2rem; font-weight:800; color:var(--fg);">0</div>
                <div style="font-size:0.8rem; color:var(--fg2); text-decoration:underline; text-underline-offset:2px;">Following</div>
            </div>
            <div style="text-align:center;">
                <div id="modalJoinedDate" style="font-size:1.2rem; font-weight:800; color:var(--fg);">---</div>
                <div style="font-size:0.8rem; color:var(--fg2);">Joined</div>
            </div>
        </div>

        <div style="display:flex; gap:12px;">
            <button id="modalFollowBtn" class="btn btn-secondary" style="flex:1;">Follow</button>
            <button id="modalDmBtn" class="btn btn-primary" style="flex:1;">Send Message</button>
        </div>
    </div>
</div>

<!-- Followers / Following List Modal -->
<div id="followListModal" class="overlay" onclick="if(event.target===this) UsersApp.closeListModal()">
    <div class="modal" style="max-height: 85vh; display:flex; flex-direction:column; max-width:480px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 id="followListTitle" style="margin:0; font-size:1.3rem;">Followers</h3>
            <button class="modal-close" onclick="UsersApp.closeListModal()">&times;</button>
        </div>
        <div id="followListContent" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; max-height:420px; padding-right:4px;"></div>
    </div>
</div>

<!-- Badge Information Modals -->
<div id="badgeInfoModal" class="overlay" onclick="if(event.target===this) UsersApp.closeBadgeModal()">
    <div class="modal" style="text-align:center;">
        <button class="modal-close" onclick="UsersApp.closeBadgeModal()">&times;</button>
        <div id="badgeModalIcon" style="margin-bottom:16px;"></div>
        <h2 id="badgeModalTitle" style="font-size:1.8rem; margin-bottom:8px;"></h2>
        <p id="badgeModalDesc" style="color:var(--fg2); line-height:1.6; margin-bottom:24px;"></p>
        <button class="btn btn-secondary" style="width:100%;" onclick="UsersApp.closeBadgeModal()">Got It</button>
    </div>
</div>

<div id="toastContainer">
    <span id="toastText"></span>
</div>

<script>
const UsersApp = {
    users: [],
    myUid: null,
    activeFilter: 'all',
    searchQuery: '',

    init: async function() {
        this.renderCurrentSession();
        await this.fetchUsers();
    },

    renderCurrentSession: function() {
        try {
            const sessStr = localStorage.getItem('bsms_auth_session');
            if (sessStr) {
                const sess = JSON.parse(sessStr);
                const pfpEl = document.getElementById('currentUserPfp');
                if (pfpEl) {
                    if (sess.avatar) pfpEl.innerHTML = `<img src="${sess.avatar}">`;
                    else pfpEl.innerText = ((sess.displayName || sess.username || '?').charAt(0)).toUpperCase();
                }
            }
        } catch(e) {}
    },

    fetchUsers: async function() {
        const grid = document.getElementById('usersGrid');
        grid.innerHTML = `
            <div class="state-container" style="grid-column: 1 / -1;">
                <div class="state-spinner"></div>
                <p>Loading active BSMS Web users...</p>
            </div>
        `;
        try {
            const sid = localStorage.getItem('session_id') || "";
            const res = await fetch('/api/auth?action=getPublicUsers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Session-ID': sid
                }
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to load users");

            this.users = data.users || [];
            this.myUid = data.myUid || null;
            this.updateCounts();
            this.renderUsers();
            this.handleHash();
        } catch (err) {
            console.error("Failed to fetch users:", err);
            grid.innerHTML = `
                <div class="state-container" style="grid-column: 1 / -1; color:#ef4444;">
                    <p>Failed to load directory. Please verify your connection.</p>
                    <button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="UsersApp.fetchUsers()">Try Again</button>
                </div>
            `;
        }
    },

    updateCounts: function() {
        const visible = this.users.filter(u => !u.hiddenFromDirectory);
        const allCount = visible.length;
        const teamCount = visible.filter(u => u.role === 'owner' || u.role === 'admin' || u.role === 'mod' || u.isDeveloper).length;
        const followingCount = visible.filter(u => u.isFollowing).length;
        document.getElementById('count-all').innerText = allCount;
        const teamEl = document.getElementById('count-team');
        if (teamEl) teamEl.innerText = teamCount;
        document.getElementById('count-following').innerText = followingCount;
    },

    setFilter: function(filter, btnEl) {
        this.activeFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
        if (btnEl) btnEl.classList.add('active');
        this.renderUsers();
    },

    onSearch: function(val) {
        this.searchQuery = (val || '').toLowerCase().trim();
        this.renderUsers();
    },

    getFilteredUsers: function() {
        let list = this.users.filter(u => {
            // Hide users who opted out of the public directory listing
            if (u.hiddenFromDirectory) return false;

            // Filter chip
            if (this.activeFilter === 'following' && !u.isFollowing) return false;
            if (this.activeFilter === 'team' && !(u.role === 'owner' || u.role === 'admin' || u.role === 'mod' || u.isDeveloper)) return false;
            if (this.activeFilter === 'verified' && !u.verified) return false;

            // Search query
            if (this.searchQuery) {
                const matchStr = `${u.displayName} ${u.username} ${u.bio || ''}`.toLowerCase();
                if (!matchStr.includes(this.searchQuery)) return false;
            }
            return true;
        });

        // Alphabetical sort by display name / username
        list.sort((a, b) => {
            const nameA = (a.displayName || a.username || '').toLowerCase();
            const nameB = (b.displayName || b.username || '').toLowerCase();
            return nameA.localeCompare(nameB);
        });

        return list;
    },

    renderMarkdown: function(str) {
        if (!str) return '';
        let out = this.escapeHTML(str);
        out = out.replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/gi, '<u>$1</u>');
        out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/__(.*?)__/g, '<u>$1</u>');
        out = out.replace(/(^|[^*])\*(?!\*)(.*?)\*(?!\*)/g, '$1<em>$2</em>');
        out = out.replace(/(^|[^_])_(?!_)(.*?)(?<!_)_/g, '$1<em>$2</em>');
        return out;
    },

    renderUsers: function() {
        const grid = document.getElementById('usersGrid');
        const list = this.getFilteredUsers();

        if (list.length === 0) {
            grid.innerHTML = `
                <div class="state-container" style="grid-column: 1 / -1;">
                    <p style="font-size:1.2rem; margin-bottom:6px;">No users found</p>
                    <p style="color:var(--fg2); font-size:0.9rem;">Try broadening your search or selecting a different filter.</p>
                </div>
            `;
            return;
        }

        let html = '';
        list.forEach(u => {
            const isMe = this.myUid && this.myUid === u.uid;
            const initial = ((u.displayName || u.username || '?').charAt(0)).toUpperCase();
            const avatarHtml = u.avatar ? `<img src="${this.escapeHTML(u.avatar)}" alt="${this.escapeHTML(u.displayName)}">` : initial;
            const badgesHtml = this.getBadgesHTML(u);

            html += `
            <div class="user-card" id="user-card-${u.uid}">
                <div class="user-card-header">
                    <div class="avatar-wrap" onclick="UsersApp.openProfileModal('${u.uid}')">
                        ${avatarHtml}
                    </div>
                    <div class="user-info">
                        <div class="name-row">
                            <span class="display-name" onclick="UsersApp.openProfileModal('${u.uid}')">${this.escapeHTML(u.displayName)}</span>
                            ${badgesHtml}
                        </div>
                        <div class="username">@${this.escapeHTML(u.username)}</div>
                    </div>
                </div>

                <div class="user-bio">${u.bio ? this.renderMarkdown(u.bio) : '<span style="color:rgba(255,255,255,0.3); font-style:italic;">No bio set.</span>'}</div>

                <div class="user-stats">
                    <div class="stat-item" style="cursor:pointer;" onclick="UsersApp.openListModal('followers', '${u.uid}')" title="Click to view followers">
                        <strong id="followers-${u.uid}">${u.followersCount}</strong> followers
                    </div>
                    <div class="stat-item" style="cursor:pointer;" onclick="UsersApp.openListModal('following', '${u.uid}')" title="Click to view following">
                        <strong>${u.followingCount}</strong> following
                    </div>
                </div>

                <div class="user-card-actions">
                    ${!isMe ? `
                        <button class="btn btn-sm ${u.isFollowing ? 'btn-secondary' : 'btn-primary'}" id="btn-follow-${u.uid}" onclick="UsersApp.toggleFollow('${u.uid}')">
                            ${u.isFollowing ? 'Unfollow' : 'Follow'}
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="UsersApp.startDM('${u.uid}')">
                            <svg style="width:14px; height:14px; fill:currentColor;"><use href="#ico-msg"></use></svg>
                            Message
                        </button>
                    ` : `
                        <a href="/accounts" class="btn btn-secondary btn-sm" style="width:100%;">Edit Profile</a>
                    `}
                </div>
            </div>
            `;
        });

        grid.innerHTML = html;
    },

    getBadgesHTML: function(u) {
        let b = '';
        if (u.role === 'owner') {
            b += `<span class="badge owner" onclick="UsersApp.showBadgeInfo('owner', '${this.escapeHTML(u.displayName)}')">Owner</span>`;
        } else if (u.role === 'admin') {
            b += `<span class="badge admin" onclick="UsersApp.showBadgeInfo('admin', '${this.escapeHTML(u.displayName)}')">Admin</span>`;
        } else if (u.role === 'mod') {
            b += `<span class="badge mod" onclick="UsersApp.showBadgeInfo('mod', '${this.escapeHTML(u.displayName)}')">Mod</span>`;
        }
        if (u.isDeveloper) {
            b += `<div class="badge-dev" title="Developer" onclick="UsersApp.showBadgeInfo('dev', '${this.escapeHTML(u.displayName)}')"><svg><use href="#ico-hammer"></use></svg></div>`;
        }
        if (u.verified) {
            b += `<svg class="badge-verified" title="Verified" onclick="UsersApp.showBadgeInfo('verified', '${this.escapeHTML(u.displayName)}')"><use href="#ico-verified"></use></svg>`;
        }
        return b;
    },

    toggleFollow: async function(targetUid) {
        const u = this.users.find(x => x.uid === targetUid);
        if (!u) return;

        const sid = localStorage.getItem('session_id');
        if (!sid) {
            this.showToast("Please log in to follow users.", "error");
            location.href = '/accounts';
            return;
        }

        const isFollowing = u.isFollowing;
        const action = isFollowing ? 'unfollow' : 'follow';
        const btn = document.getElementById(`btn-follow-${targetUid}`);
        if (btn) btn.disabled = true;

        try {
            const res = await fetch(`/api/auth?action=${action}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Session-ID': sid
                },
                body: JSON.stringify({ targetUid })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Action failed");

            u.isFollowing = !isFollowing;
            u.followersCount += isFollowing ? -1 : 1;
            this.updateCounts();
            
            const countEl = document.getElementById(`followers-${targetUid}`);
            if (countEl) countEl.innerText = u.followersCount;

            if (btn) {
                btn.className = `btn btn-sm ${u.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
                btn.innerText = u.isFollowing ? 'Unfollow' : 'Follow';
            }

            // Sync with profile modal if open
            const modalFollowBtn = document.getElementById('modalFollowBtn');
            if (modalFollowBtn && modalFollowBtn.dataset.uid === targetUid) {
                modalFollowBtn.className = `btn ${u.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
                modalFollowBtn.innerText = u.isFollowing ? 'Unfollow' : 'Follow';
                document.getElementById('modalFollowersCount').innerText = u.followersCount;
            }

            this.showToast(u.isFollowing ? `You are now following ${u.displayName}!` : `Unfollowed ${u.displayName}`, "success");
        } catch (err) {
            this.showToast(err.message || "Failed to update follow status", "error");
        } finally {
            if (btn) btn.disabled = false;
        }
    },

    startDM: async function(targetUid) {
        const sid = localStorage.getItem('session_id');
        if (!sid) {
            location.href = '/accounts';
            return;
        }
        try {
            const res = await fetch('/api/chat?action=startDM', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Session-ID': sid
                },
                body: JSON.stringify({ targetUid })
            });
            const data = await res.json();
            if (data && data.cid) {
                location.href = `/chat#dm/${encodeURIComponent(data.cid)}`;
                return;
            }
        } catch(e) {}
        location.href = `/chat#user/${encodeURIComponent(targetUid)}`;
    },

    openProfileModal: function(uid) {
        const u = this.users.find(x => x.uid === uid);
        if (!u) return;

        this.currentModalUid = uid;
        const isMe = this.myUid && this.myUid === u.uid;
        const initial = ((u.displayName || u.username || '?').charAt(0)).toUpperCase();
        document.getElementById('modalAvatar').innerHTML = u.avatar ? `<img src="${this.escapeHTML(u.avatar)}">` : initial;
        document.getElementById('modalNameRow').innerHTML = `<strong>${this.escapeHTML(u.displayName)}</strong> ${this.getBadgesHTML(u)}`;
        document.getElementById('modalUsername').innerText = `@${u.username}`;
        document.getElementById('modalBio').innerHTML = u.bio ? this.renderMarkdown(u.bio) : '<span style="color:var(--fg2); font-style:italic;">This user hasn\'t written a biography yet.</span>';
        document.getElementById('modalFollowersCount').innerText = u.followersCount;
        document.getElementById('modalFollowingCount').innerText = u.followingCount;
        document.getElementById('modalJoinedDate').innerText = u.createdAt ? new Date(u.createdAt).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '2026';

        const followBtn = document.getElementById('modalFollowBtn');
        const dmBtn = document.getElementById('modalDmBtn');
        followBtn.dataset.uid = u.uid;

        if (isMe) {
            followBtn.style.display = 'none';
            dmBtn.innerText = "Edit My Profile";
            dmBtn.onclick = () => location.href = '/accounts';
        } else {
            followBtn.style.display = 'inline-flex';
            followBtn.className = `btn ${u.isFollowing ? 'btn-secondary' : 'btn-primary'}`;
            followBtn.innerText = u.isFollowing ? 'Unfollow' : 'Follow';
            followBtn.onclick = () => this.toggleFollow(u.uid);

            dmBtn.innerText = "Send Message";
            dmBtn.onclick = () => this.startDM(u.uid);
        }

        history.replaceState(null, null, `#/${encodeURIComponent(u.username)}`);
        document.getElementById('profileModal').classList.add('show');
    },

    closeProfileModal: function() {
        document.getElementById('profileModal').classList.remove('show');
        history.replaceState(null, null, window.location.pathname);
    },

    handleHash: function() {
        const hash = window.location.hash;
        if (!hash || hash.length < 2) return;
        const clean = decodeURIComponent(hash.replace(/^[#\/\[]+/, '').replace(/[\]]+$/, '')).trim().toLowerCase();
        if (!clean) return;
        const target = this.users.find(u => (u.username && u.username.toLowerCase() === clean) || u.uid === clean);
        if (target) {
            this.openProfileModal(target.uid);
        }
    },

    openListModal: function(type, targetUid) {
        const uid = targetUid || this.currentModalUid;
        const u = this.users.find(x => x.uid === uid);
        if (!u) return;

        const isFollowers = type === 'followers';
        document.getElementById('followListTitle').innerText = isFollowers 
            ? `${u.displayName}'s Followers` 
            : `${u.displayName} is Following`;

        const listUids = isFollowers ? (u.followersList || []) : (u.followingList || []);
        const listContent = document.getElementById('followListContent');

        if (listUids.length === 0) {
            listContent.innerHTML = `
                <div style="text-align:center; padding:30px 10px; color:var(--fg2);">
                    <p style="margin:0; font-size:1rem;">${isFollowers ? 'No followers yet.' : 'Not following anyone yet.'}</p>
                </div>
            `;
        } else {
            let html = '';
            listUids.forEach(mId => {
                const member = this.users.find(x => x.uid === mId);
                const dName = member ? member.displayName : mId;
                const uName = member ? member.username : mId;
                const av = member && member.avatar ? `<img src="${this.escapeHTML(member.avatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : (dName.charAt(0).toUpperCase());
                const badges = member ? this.getBadgesHTML(member) : '';

                html += `
                <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px;">
                    <div style="display:flex; align-items:center; gap:10px; overflow:hidden; cursor:pointer;" onclick="UsersApp.closeListModal(); UsersApp.openProfileModal('${mId}')">
                        <div class="avatar-wrap" style="width:38px; height:38px; font-size:1rem; flex-shrink:0;">${av}</div>
                        <div style="overflow:hidden; text-align:left;">
                            <div style="font-weight:700; color:var(--fg); display:flex; align-items:center; gap:4px; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                ${this.escapeHTML(dName)} ${badges}
                            </div>
                            <div style="font-size:0.8rem; color:var(--fg2);">@${this.escapeHTML(uName)}</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" style="flex-shrink:0; width:auto; padding:4px 10px; font-size:0.8rem;" onclick="UsersApp.closeListModal(); UsersApp.openProfileModal('${mId}')">View</button>
                </div>
                `;
            });
            listContent.innerHTML = html;
        }

        document.getElementById('followListModal').classList.add('show');
    },

    closeListModal: function() {
        document.getElementById('followListModal').classList.remove('show');
    },

    showBadgeInfo: function(type, userName) {
        const modal = document.getElementById('badgeInfoModal');
        const iconEl = document.getElementById('badgeModalIcon');
        const titleEl = document.getElementById('badgeModalTitle');
        const descEl = document.getElementById('badgeModalDesc');

        if (type === 'owner') {
            iconEl.innerHTML = `<span class="badge owner" style="font-size:1.1rem; padding:4px 14px;">Owner</span>`;
            titleEl.innerText = "Platform Owner";
            descEl.innerHTML = `<strong>${userName}</strong> is the central platform owner of BSMS Web, overseeing system governance, core security, and administrative hierarchy.`;
        } else if (type === 'admin') {
            iconEl.innerHTML = `<span class="badge admin" style="font-size:1.1rem; padding:4px 14px;">Admin</span>`;
            titleEl.innerText = "System Administrator";
            descEl.innerHTML = `<strong>${userName}</strong> is an official BSMS Web Administrator with permissions to manage accounts, safeguard safety, and oversee ecosystem integrity.`;
        } else if (type === 'mod') {
            iconEl.innerHTML = `<span class="badge mod" style="font-size:1.1rem; padding:4px 14px;">Mod</span>`;
            titleEl.innerText = "Community Moderator";
            descEl.innerHTML = `<strong>${userName}</strong> is a Community Moderator designated to monitor channels, enforce school guidelines, and protect discussion environments.`;
        } else if (type === 'dev') {
            iconEl.innerHTML = `<div class="badge-dev" style="width:36px; height:36px; margin:0 auto;"><svg style="width:20px; height:20px;"><use href="#ico-hammer"></use></svg></div>`;
            titleEl.innerText = "Platform Developer";
            descEl.innerHTML = `<strong>${userName}</strong> is an active developer contributing code, infrastructure, and technical architecture to BSMS Web.`;
        } else if (type === 'verified') {
            iconEl.innerHTML = `<svg class="badge-verified" style="width:36px; height:36px;"><use href="#ico-verified"></use></svg>`;
            titleEl.innerText = "Verified Identity";
            descEl.innerHTML = `<strong>${userName}</strong> is an officially verified identity authenticated by the BSMS Web team.`;
        }

        modal.classList.add('show');
    },

    closeBadgeModal: function() {
        document.getElementById('badgeInfoModal').classList.remove('show');
    },

    showToast: function(msg, type = "info") {
        const t = document.getElementById('toastContainer');
        t.className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
        document.getElementById('toastText').innerText = msg;
        t.classList.add('show');
        clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => t.classList.remove('show'), 3500);
    },

    escapeHTML: function(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
};

window.addEventListener('DOMContentLoaded', () => UsersApp.init());
</script>
</body>
</html>
