name = "bsms-web-reader"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = false

routes = [
  { pattern = "reader.bsms-web.com", custom_domain = true }
]

[vars]
BSMS_WEB_API_URL = "https://api.bsms-web.com"

# Configure secrets with Wrangler:
# wrangler secret put BSMS_WEB_API_KEY
# wrangler secret put READER_SIGNING_SECRET
